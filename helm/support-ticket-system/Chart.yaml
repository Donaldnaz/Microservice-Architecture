apiVersion: v2
name: support-ticket-system
description: >
  Helm chart for the Support Ticket System.
  Deploys frontend (Nginx), ticket-api (Flask), and notification-service (Flask)
  across frontend/backend namespaces with HPA, Cluster Autoscaler, and an ALB Ingress.
type: application
version: 0.1.0
appVersion: "1.0.0"

# Requires Kubernetes 1.24+ for stable IngressClass and autoscaling/v2 HPA
kubeVersion: ">=1.24.0"

keywords:
  - support-tickets
  - flask
  - nginx
  - eks
  - alb
