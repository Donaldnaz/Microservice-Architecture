# =============================================================================
# Secret — RDS PostgreSQL credentials
# Stored in the backend namespace; consumed by ticket-api as env vars.
#
# Values must be base64-encoded in values.yaml (or a secrets override file).
# In production, prefer External Secrets Operator syncing from AWS Secrets
# Manager instead of embedding credentials in values files.
#
# NEVER commit the file containing rds.* values to version control.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "support-ticket-system.fullname" . }}-rds-credentials
  namespace: {{ .Values.namespaces.backend }}
  labels:
    {{- include "support-ticket-system.labels" . | nindent 4 }}
type: Opaque
data:
  DB_HOST:     {{ .Values.rds.host     | quote }}
  DB_PORT:     {{ .Values.rds.port     | quote }}
  DB_NAME:     {{ .Values.rds.name     | quote }}
  DB_USER:     {{ .Values.rds.user     | quote }}
  DB_PASSWORD: {{ .Values.rds.password | quote }}
