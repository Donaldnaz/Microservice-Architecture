# =============================================================================
# Cluster Autoscaler
# Scales EC2 nodes up/down based on pod scheduling pressure and utilisation.
#
#   SCALE UP:   Pod is Pending (no node has enough free CPU/memory)
#               → CA increases the ASG desired count
#   SCALE DOWN: Node's requested resources stay below utilizationThreshold
#               for unneededTime → CA drains and terminates the node
#
# PRE-REQUISITES:
#   1. IRSA role ARN set in values.clusterAutoscaler.irsaRoleArn
#      (created via: eksctl create iamserviceaccount ...)
#   2. EKS managed node group ASG tagged:
#        k8s.io/cluster-autoscaler/<clusterName> = owned
#        k8s.io/cluster-autoscaler/enabled       = true
#   3. values.aws.clusterName set to your EKS cluster name
# =============================================================================

---
# ServiceAccount — IRSA annotation gives the CA pod short-lived AWS credentials
# via the Pod Identity Webhook. No static access keys needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
  namespace: kube-system
  labels:
    {{- include "support-ticket-system.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.clusterAutoscaler.irsaRoleArn | quote }}

---
# ClusterRole — grants CA the minimum permissions needed to read pod/node state
# and write node updates (for cordoning/draining during scale-down)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
  labels:
    {{- include "support-ticket-system.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "replicationcontrollers",
                "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["extensions"]
    resources: ["replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["watch", "list", "create", "update", "get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status", "cluster-autoscaler-priority-expander"]
    verbs: ["delete", "get", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
  labels:
    {{- include "support-ticket-system.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
    namespace: kube-system

---
# Single replica is correct — CA uses leader-election so even with multiple
# replicas only one is active. One replica avoids unnecessary complexity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
  namespace: kube-system
  labels:
    {{- include "support-ticket-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
  template:
    metadata:
      labels:
        app: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
        {{- include "support-ticket-system.labels" . | nindent 8 }}
      annotations:
        # Prevent CA from evicting its own pod during a scale-down event
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: {{ include "support-ticket-system.fullname" . }}-cluster-autoscaler
      # system-cluster-critical ensures CA is scheduled even under resource pressure
      priorityClassName: system-cluster-critical
      containers:
        - name: cluster-autoscaler
          # Pin CA version to match your EKS Kubernetes minor version.
          # EKS 1.29 → v1.29.x | https://github.com/kubernetes/autoscaler/releases
          image: registry.k8s.io/autoscaling/cluster-autoscaler:{{ .Values.clusterAutoscaler.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - ./cluster-autoscaler
            - --v=4
            - --stderrthreshold=info
            - --cloud-provider=aws
            - --skip-nodes-with-local-storage=false
            # least-waste expander picks the node group that wastes the fewest resources
            - --expander=least-waste
            # Auto-discover ASGs by cluster tag — no hardcoded ASG names required
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled=true,k8s.io/cluster-autoscaler/{{ .Values.aws.clusterName }}=owned
            # Remove nodes whose requested resources stay below this threshold
            - --scale-down-utilization-threshold={{ .Values.clusterAutoscaler.scaleDown.utilizationThreshold }}
            # Wait after a scale-up before evaluating scale-down (prevents thrashing)
            - --scale-down-delay-after-add={{ .Values.clusterAutoscaler.scaleDown.delayAfterAdd }}
            - --scan-interval=10s
            # Node must be underutilised for this long before CA drains/terminates it
            - --scale-down-unneeded-time={{ .Values.clusterAutoscaler.scaleDown.unneededTime }}
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
          resources:
            {{- toYaml .Values.clusterAutoscaler.resources | nindent 12 }}
          # CA exposes a health endpoint on port 8085
          livenessProbe:
            httpGet:
              path: /health-check
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
      volumes:
        - name: ssl-certs
          hostPath:
            path: /etc/ssl/certs/ca-bundle.crt
