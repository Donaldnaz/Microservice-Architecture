# =============================================================================
# Namespaces
# Creates the frontend and backend namespaces.
# Names are configurable via values.namespaces to support multi-environment
# installs (e.g. frontend-staging, backend-staging).
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.frontend }}
  labels:
    {{- include "support-ticket-system.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.backend }}
  labels:
    {{- include "support-ticket-system.labels" . | nindent 4 }}
